<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>化学1 試験対策用・統合教科書</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">χ</span><div><b>化学1</b><small>Exam Textbook</small></div></div>
      <nav id="chapterNav"></nav>
      <div class="sidebar-tools">
        <button id="openQuizBtn" class="primary full">問題演習を開く</button>
        <button id="themeBtn" class="ghost full">テーマ切替</button>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="search-wrap"><input id="globalSearch" placeholder="教科書内検索：例 電子配置, 水素結合, mol" /></div>
        <div class="stats"><span id="questionCount"></span><span id="progressStat"></span></div>
      </header>
      <section id="content" class="content"></section>
      <section id="tools" class="content tools-section"></section>
    </main>
  </div>
  <div id="quizPanel" class="quiz-panel" aria-hidden="true">
    <div class="quiz-inner">
      <div class="quiz-head"><div><p class="eyebrow">Interactive Practice</p><h2>100問以上の問題集</h2></div><button id="closeQuiz" class="icon-btn">×</button></div>
      <div class="quiz-controls">
        <select id="quizChapter"></select><select id="quizDifficulty"><option value="all">全難易度</option><option value="basic">基本</option><option value="standard">標準</option><option value="challenge">発展</option></select>
        <input id="quizSearch" placeholder="問題検索" />
        <button id="startPractice" class="primary">章別演習</button><button id="startExam" class="secondary">25問模試</button><button id="showAllQuestions" class="ghost">一覧</button>
      </div>
      <div id="quizArea" class="quiz-area"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
